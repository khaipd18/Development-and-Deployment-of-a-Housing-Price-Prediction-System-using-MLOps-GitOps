name: Validate manifests

# CI cho repo GitOps: render Kustomize+Helm (như ArgoCD) rồi kiểm manifest bằng
# kubeconform -> bắt lỗi cấu hình NGAY trong PR, thay vì đợi ArgoCD sync mới lộ.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-validate:
    name: Kustomize build + kubeconform (dev & prod)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Install helm, kustomize, kubeconform (pinned)
        run: |
          set -e
          curl -sSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar -xz linux-amd64/helm
          sudo mv linux-amd64/helm /usr/local/bin/helm
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz" | tar -xz kustomize
          sudo mv kustomize /usr/local/bin/kustomize
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          helm version; kustomize version; kubeconform -v

      - name: Render + validate overlays
        run: |
          set -euo pipefail
          for env in dev prod; do
            echo "==================== $env ===================="
            kustomize build --enable-helm --load-restrictor LoadRestrictionsNone "app/overlays/$env" \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}.json'
          done

      # Manifest ngoài app/overlays trước đây KHÔNG được kiểm gì cả: Application của
      # ArgoCD, ServiceMonitor, PrometheusRule, ConfigMap dashboard. Gõ sai ở đó chỉ lộ
      # khi đã dựng cụm — tức là lúc đang tốn tiền. Kiểm luôn tại PR.
      - name: Validate ArgoCD Applications + manifest quan trắc
        run: |
          set -euo pipefail
          for dir in argocd observability; do
            echo "==================== $dir ===================="
            kubeconform -strict -summary -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}.json' \
                $(find "$dir" -name '*.yaml' -not -name 'kustomization.yaml' -not -path "$dir/tests/*")
          done

      # PrometheusRule: kubeconform chỉ biết manifest ĐÚNG SCHEMA, nó không hiểu
      # PromQL bên trong. Biểu thức sai cú pháp, hoặc alert kêu oan vì gộp nhầm
      # handler, chỉ lộ ra khi cụm đã chạy. promtool kiểm được cả hai ngay ở PR.
      - name: promtool — kiểm cú pháp và unit test PromQL
        run: |
          set -euo pipefail
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz \
            | tar -xz prometheus-3.5.0.linux-amd64/promtool
          sudo mv prometheus-3.5.0.linux-amd64/promtool /usr/local/bin/promtool
          promtool --version

          # File test của promtool trỏ tới `rules.yaml`, nên phải tách phần
          # spec.groups của PrometheusRule ra thành file rời đúng tên đó.
          mkdir -p /tmp/promtest
          python3 - <<'EOS'
          import glob, pathlib, yaml
          groups = []
          for f in glob.glob("observability/prometheusrule-*.yaml"):
              groups += yaml.safe_load(open(f))["spec"]["groups"]
          assert groups, "không tìm thấy PrometheusRule nào"
          pathlib.Path("/tmp/promtest/rules.yaml").write_text(
              yaml.safe_dump({"groups": groups}, allow_unicode=True, sort_keys=False))
          print(f"  đã tách {len(groups)} group")
          EOS

          promtool check rules /tmp/promtest/rules.yaml
          cp observability/tests/*_test.yaml /tmp/promtest/
          for t in /tmp/promtest/*_test.yaml; do
            echo "==================== $(basename "$t") ===================="
            promtool test rules "$t"
          done

      # Query của canary quyết định promote hay rollback, nhưng nó nằm trong
      # AnalysisTemplate nên kubeconform không nhìn vào và promtool cũng không tự
      # tìm thấy. Bước này buộc mỗi query trong template phải có mặt trong file
      # test, nên sửa template mà quên sửa test là CI đỏ — chứ không phải trông vào
      # việc người sửa còn nhớ.
      - name: Query canary trong AnalysisTemplate phải được test
        run: |
          python3 - <<'EOS'
          import glob, re, sys, yaml

          def gon(q):
              return re.sub(r"\s+", " ", q).strip()

          # Mọi expr xuất hiện trong các file test
          da_test = set()
          for f in glob.glob("observability/tests/*_test.yaml"):
              d = yaml.safe_load(open(f)) or {}
              for t in d.get("tests", []):
                  for c in t.get("promql_expr_test", []):
                      da_test.add(gon(c["expr"]))

          thieu, tong = [], 0
          for f in glob.glob("app/overlays/*/analysistemplate-*.yaml"):
              d = yaml.safe_load(open(f))
              args = {a["name"]: a.get("value", "") for a in d["spec"].get("args", [])}
              for m in d["spec"]["metrics"]:
                  q = m["provider"]["prometheus"]["query"]
                  for k, v in args.items():
                      q = q.replace("{{args.%s}}" % k, v)
                  tong += 1
                  if gon(q) not in da_test:
                      thieu.append((f, m["name"], gon(q)))

          assert tong, "không tìm thấy query canary nào — đường dẫn đã đổi?"
          for f, n, q in thieu:
              print(f"  THIẾU TEST  {f}  metric={n}")
              print(f"              {q}")
          if thieu:
              sys.exit(f"{len(thieu)}/{tong} query canary chưa có test tương ứng")
          print(f"  {tong}/{tong} query canary đều có test")
          EOS

      # Dashboard nhúng JSON trong YAML — YAML hợp lệ không có nghĩa JSON bên trong
      # hợp lệ. Panel hỏng chỉ hiện ra khi mở Grafana, nên parse luôn ở đây.
      - name: Kiểm JSON dashboard nhúng trong ConfigMap
        run: |
          python3 - <<'EOS'
          import glob, json, sys, yaml
          ok = 0
          for f in glob.glob("observability/grafana-dashboard-*.yaml"):
              cm = yaml.safe_load(open(f))
              for key, body in (cm.get("data") or {}).items():
                  d = json.loads(body)
                  assert d.get("panels"), f"{f}:{key} không có panel nào"
                  print(f"  ok {f}:{key} — {len(d['panels'])} panel")
                  ok += 1
          if ok == 0:
              sys.exit("Không tìm thấy dashboard nào để kiểm")
          EOS
