# Alert rule cho T11. Chính nguồn số đo này sẽ là căn cứ cho AnalysisTemplate của
# canary ở T12, nên ngưỡng ở đây và ngưỡng rollback phải thống nhất.
#
# Lưu ý PromQL: histogram KHÔNG có nhãn `status`, nên không lọc latency theo mã lỗi
# được. Đó là giới hạn của bộ instrumentation, không phải thiếu sót khi viết rule.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: housing-api
  namespace: observability
  labels:
    app.kubernetes.io/part-of: housing-mlops
spec:
  groups:
    - name: housing-api.rules
      rules:
        # --- Số đo tái sử dụng: tính sẵn để dashboard, alert và canary dùng chung
        # một định nghĩa, tránh mỗi nơi viết một kiểu rồi lệch nhau.
        - record: housing:api_request_rate5m
          expr: sum by (namespace) (rate(http_requests_total{job="housing-api"}[5m]))
        # `or ... * 0` là phần bắt buộc, không phải cho đẹp: khi KHÔNG có request 5xx
        # nào thì tử số không sinh chuỗi, phép chia ra rỗng, và hậu quả là alert
        # HousingApiHighErrorRate vĩnh viễn không có gì để so ngưỡng còn dashboard
        # hiện "No data" thay vì 0%. Nhân 0 vào chuỗi tổng để luôn có một chuỗi giá
        # trị 0 cho mỗi namespace đang có traffic. clamp_min chỉ bảo vệ MẪU SỐ nên
        # một mình nó không giải quyết được.
        - record: housing:api_error_ratio5m
          expr: |
            (
              sum by (namespace) (rate(http_requests_total{job="housing-api",status=~"5.."}[5m]))
              or
              sum by (namespace) (rate(http_requests_total{job="housing-api"}[5m])) * 0
            )
            /
            clamp_min(sum by (namespace) (rate(http_requests_total{job="housing-api"}[5m])), 1e-9)
        - record: housing:api_latency_p95_5m
          expr: |
            histogram_quantile(0.95,
              sum by (namespace, le) (rate(http_request_duration_seconds_bucket{job="housing-api"}[5m])))

        # --- Cảnh báo
        - alert: HousingApiHighErrorRate
          expr: housing:api_error_ratio5m > 0.05
          for: 5m
          labels: {severity: critical, component: housing-api}
          annotations:
            summary: "housing-api lỗi 5xx vượt 5% ({{ $labels.namespace }})"
            description: "Tỷ lệ 5xx trong 5 phút là {{ $value | humanizePercentage }}. Kiểm model/encoder đã nạp được chưa, và bản vừa deploy."

        - alert: HousingApiHighLatencyP95
          expr: housing:api_latency_p95_5m > 1
          for: 10m
          labels: {severity: warning, component: housing-api}
          annotations:
            summary: "housing-api p95 vượt 1s ({{ $labels.namespace }})"
            description: "p95 hiện {{ $value | humanizeDuration }}. Xem pod có bị giới hạn CPU không, hoặc tải tăng đột biến."

        - alert: HousingApiDown
          expr: up{job="housing-api"} == 0
          for: 3m
          labels: {severity: critical, component: housing-api}
          annotations:
            summary: "Prometheus không scrape được housing-api ({{ $labels.namespace }})"
            description: "Pod chết, Service sai selector, hoặc /metrics không còn. Đây cũng là tín hiệu canary nên dừng."
