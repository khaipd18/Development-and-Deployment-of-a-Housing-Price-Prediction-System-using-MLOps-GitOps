deployment: 
  enabled: true

replicaCount: 2

serviceAccount:
  create: true
  name: "housing-api"

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

image:
  repository: "090885120487.dkr.ecr.ap-southeast-1.amazonaws.com/housing-api" 
  tag: "latest"
  pullPolicy: Always

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

service:
  enabled: true
  type: ClusterIP
  port: 8000
  targetPort: 8000
  annotations:
    # Ingress không khai báo healthcheck-path nên ALB mặc định gọi "/". API không có
    # route "/" (trả 404), tức target group của API luôn unhealthy và ALB chỉ còn
    # chạy nhờ cơ chế fail-open (mọi target hỏng thì gửi cho tất cả). Health check
    # của ALB khi đó vô nghĩa: không loại được pod nào hỏng thật.
    alb.ingress.kubernetes.io/healthcheck-path: /health

env:
  PORT: "8000"
  # Cờ bật S3 của pipeline. API chỉ ĐỌC: nó cần đọc drift/latest.json để phát các
  # metric housing_drift_* ra /metrics. Thiếu cờ này thì `doc_json_s3` trả None và
  # MỌI metric drift bằng 0 vĩnh viễn — đã kiểm trên cụm thật ngày 18/10/2026:
  # pod phát housing_drift_detected 0 và last_detection_timestamp 0 trong khi tín hiệu
  # trên S3 là no_drift có timestamp thật. Dashboard và alert sẽ im lặng mà không ai
  # biết là do thiếu cấu hình.
  # Quyền: node role có AmazonS3ReadOnlyAccess nên pod đọc được, không cần IRSA riêng.
  HCM_S3_PUSH: "1"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

probes:
  # Khởi động của API nặng: import xgboost/shap/sklearn, nạp model 7,6MB và dataset,
  # rồi từ PR #35 còn làm ấm cache /explain/global trước khi phục vụ.
  #
  # Không có startupProbe thì liveness kiểm lần đầu ở giây 15 và chỉ cho 3 lần hỏng,
  # tức pod bị GIẾT ở khoảng giây 55 nếu khởi động lâu hơn thế — hậu quả là crash loop,
  # kiểu hỏng tệ nhất. Local đo được 2,4s, nhưng trên cụm pod bị giới hạn 1 CPU và
  # phần SHAP chậm hơn ~5,7 lần (7,57s so với 1,33s), nên biên an toàn mỏng và phụ
  # thuộc vào một ƯỚC LƯỢNG chứ không phải số đo.
  #
  # startupProbe gỡ bỏ hẳn việc phải ước lượng: kubelet KHÔNG chạy liveness và
  # readiness cho tới khi probe này đạt. 30 lần x 3s cho tối đa 90 giây để khởi động,
  # sau đó liveness mới tiếp quản với ngưỡng chặt như cũ.
  startup:
    httpGet:
      path: /docs
      port: 8000
    periodSeconds: 3
    failureThreshold: 30
  # Readiness hỏi "pod này phục vụ được chưa" nên phải gọi /health: /docs chỉ chứng
  # minh FastAPI đã lên. Đo thật với image thiếu model: /docs trả 200 (pod sẽ Ready
  # và nhận traffic), còn mọi /predict trả 503; /health trả 503 đúng như cần.
  #
  # Liveness và startup GIỮ /docs: chúng hỏi "tiến trình còn sống không". Đặt liveness
  # vào /health thì image thiếu model sẽ bị giết rồi khởi động lại mãi — restart không
  # sửa được image hỏng, chỉ biến một pod NotReady dễ điều tra thành CrashLoopBackOff.
  #
  # timeoutSeconds 3 (mặc định 1): khi một pod bị dồn tới bão hoà, đo cục bộ cả /docs
  # lẫn /health đều p95 ~1,7–1,9 s. Với 1 s, liveness có thể giết pod đúng lúc tải đỉnh.
  # Cần /health là async (repo app, PR #73) thì con số này mới đúng cho /health.
  readiness:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

  liveness:
    httpGet:
      path: /docs
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
