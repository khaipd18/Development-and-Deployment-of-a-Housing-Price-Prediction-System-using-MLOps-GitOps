deployment: 
  enabled: true

replicaCount: 2

serviceAccount:
  create: true
  name: "housing-api"

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

image:
  repository: "090885120487.dkr.ecr.ap-southeast-1.amazonaws.com/housing-api" 
  tag: "latest"
  pullPolicy: Always

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

service:
  enabled: true
  type: ClusterIP
  port: 8000
  targetPort: 8000

env:
  PORT: "8000"
  # Cờ bật S3 của pipeline. API chỉ ĐỌC: nó cần đọc drift/latest.json để phát các
  # metric housing_drift_* ra /metrics. Thiếu cờ này thì `doc_json_s3` trả None và
  # MỌI metric drift bằng 0 vĩnh viễn — đã kiểm trên cụm thật ngày 18/10/2026:
  # pod phát housing_drift_detected 0 và last_detection_timestamp 0 trong khi tín hiệu
  # trên S3 là no_drift có timestamp thật. Dashboard và alert sẽ im lặng mà không ai
  # biết là do thiếu cấu hình.
  # Quyền: node role có AmazonS3ReadOnlyAccess nên pod đọc được, không cần IRSA riêng.
  HCM_S3_PUSH: "1"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

probes:
  readiness:
    httpGet:
      path: /docs
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 3
  
  liveness:
    httpGet:
      path: /docs
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 20
    successThreshold: 1
    failureThreshold: 3
