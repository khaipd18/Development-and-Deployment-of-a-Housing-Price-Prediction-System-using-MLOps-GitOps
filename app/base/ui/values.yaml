deployment: 
  enabled: true

replicaCount: 2 

serviceAccount:
  create: true
  name: "housing-ui"

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

image:
  repository: "090885120487.dkr.ecr.ap-southeast-1.amazonaws.com/housing-ui" 
  tag: "latest"
  pullPolicy: Always

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false 

service:
  enabled: true
  type: ClusterIP 
  port: 8501
  targetPort: 8501

env:
  STREAMLIT_SERVER_PORT: "8501"
  STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
  STREAMLIT_SERVER_HEADLESS: "true"
  # Streamlit phục vụ dưới /streamlit (ingress) -> phải khai báo base path.
  STREAMLIT_SERVER_BASE_URL_PATH: "streamlit"
  # HCM ui gọi API theo BASE url rồi tự nối /predict,/options,... (KHÔNG kèm /predict)
  API_URL: http://housing-api:8000

resources:
  limits:
    cpu: 500m
    memory: 1Gi 
  requests:
    cpu: 250m
    memory: 512Mi

probes:
  readiness:
    httpGet:
      path: /streamlit/_stcore/health
      port: 8501
    initialDelaySeconds: 15 
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 3
  
  liveness:
    httpGet:
      path: /streamlit/_stcore/health
      port: 8501
    initialDelaySeconds: 20
    periodSeconds: 20
    successThreshold: 1
    failureThreshold: 3