# AnalysisTemplate cho canary của housing-api (T12).
#
# Argo Rollouts chạy template này SONG SONG với canary. Mỗi lần đo, nếu biểu thức
# không thoả `successCondition` thì tính là một lần hỏng; đủ `failureLimit` lần hỏng
# thì Rollout tự abort và quay về bản stable — rollback dựa trên SỐ ĐO chứ không phải
# người ngồi nhìn.
#
# ─────────────────────────────────────────────────────────────────────────────
# VÌ SAO DÙNG housing:predict_latency_p95_5m CHỨ KHÔNG PHẢI p95 GỘP
#
# /explain/global chạy TreeSHAP nên chậm theo đúng bản chất của nó: đo trên cụm là
# 5,5-7,6 giây lúc cache lạnh, trong khi /predict là 3,4ms. Nếu canary nhìn p95 gộp
# mọi handler thì chỉ cần endpoint giải thích chiếm hơn ~5% lưu lượng là nó rollback
# một bản HOÀN TOÀN TỐT. Recording rule tách riêng đường dự đoán đã có từ T11
# (GitOps PR #8) chính là để dùng ở đây.
#
# NGƯỠNG PHẢI KHỚP ALERT T11, nếu không sẽ có nghịch lý: alert kêu mà canary vẫn cho
# qua, hoặc canary abort trong khi dashboard báo mọi thứ bình thường.
#   HousingApiHighErrorRate   : housing:api_error_ratio5m    > 0.05
#   HousingApiHighLatencyP95  : housing:predict_latency_p95_5m > 1
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: housing-api-canary
  namespace: housing-prod
spec:
  args:
    - name: namespace
      value: housing-prod

  metrics:
    # ── Tỷ lệ lỗi 5xx ────────────────────────────────────────────────────────
    # `or ... * 0` là phần bắt buộc chứ không phải cho đẹp: khi KHÔNG có request 5xx
    # nào thì tử số không sinh chuỗi, phép chia trả về rỗng, và Rollouts coi kết quả
    # rỗng là một phép đo KHÔNG thành công. Nghĩa là thiếu nó thì canary abort đúng
    # vào lúc hệ thống hoàn hảo. Cùng một cái bẫy đã gặp ở recording rule T11.
    - name: error-ratio
      interval: 1m
      count: 5
      # Cho qua 1 lần hỏng lẻ (nhiễu đo), hỏng 2 lần thì abort.
      failureLimit: 1
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
          query: |
            (
              sum(rate(http_requests_total{job="housing-api",namespace="{{args.namespace}}",status=~"5.."}[2m]))
              or
              sum(rate(http_requests_total{job="housing-api",namespace="{{args.namespace}}"}[2m])) * 0
            )
            /
            clamp_min(sum(rate(http_requests_total{job="housing-api",namespace="{{args.namespace}}"}[2m])), 1e-9)
            or vector(0)
      successCondition: result[0] <= 0.05

    # ── Latency p95 CỦA RIÊNG ĐƯỜNG DỰ ĐOÁN ──────────────────────────────────
    # Lọc handler="/predict" ngay trong query thay vì dùng recording rule, vì
    # recording rule gộp theo namespace nên không tách được canary với stable.
    # Ngưỡng 1s giữ y như HousingApiHighLatencyP95.
    - name: predict-latency-p95
      interval: 1m
      count: 5
      failureLimit: 1
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
          # Query này phải chống ĐỦ HAI trạng thái "không có tải", và cả hai đều đã
          # đo được trên cụm thật ngày 19-20/10/2026 chứ không phải phòng xa:
          #
          # 1. CHƯA TỪNG có request /predict -> không có chuỗi nào, query trả RỖNG,
          #    `result[0]` vỡ với "reflect: slice index out of range". Rollouts tính
          #    là phép đo "Error"; lần test đầu đếm được 3 Error liên tiếp trong khi
          #    consecutiveErrorLimit mặc định là 4 — thiếu một nhịp là abort oan.
          #    -> `or vector(0)` xử lý ca này.
          #
          # 2. ĐÃ TỪNG có request nhưng 2 phút gần nhất thì không: chuỗi bucket VẪN
          #    tồn tại, rate của mọi bucket bằng 0, và histogram_quantile(0.95, toàn
          #    số 0) = NaN. Vì chuỗi tồn tại nên `or vector(0)` KHÔNG kích hoạt,
          #    result[0] = NaN, và `NaN <= 1` là FALSE -> phép đo "Failed". Với
          #    failureLimit 1 thì chỉ cần 2 nhịp vắng tải là canary abort oan — tệ
          #    hơn ca 1 vì ngưỡng thấp hơn.
          #    -> `>= 0` xử lý ca này: trong Prometheus mọi so sánh với NaN đều sai,
          #       nên mẫu NaN bị LỌC BỎ, biểu thức thành rỗng, rồi `or vector(0)`
          #       mới có chỗ chen vào. Giá trị thật thì luôn >= 0 nên đi qua nguyên vẹn.
          #
          # Đo đối chứng trên Prometheus của cụm lúc không có tải:
          #   chỉ `or vector(0)`      -> 1 chuỗi, giá trị NaN
          #   `>= 0` rồi `or vector(0)` -> 1 chuỗi, giá trị 0
          query: |
            (
              histogram_quantile(0.95,
                sum by (le) (
                  rate(http_request_duration_seconds_bucket{job="housing-api",namespace="{{args.namespace}}",handler="/predict"}[2m])
                )
              )
              >= 0
            )
            or vector(0)
      successCondition: result[0] <= 1
