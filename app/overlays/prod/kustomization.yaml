apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # AnalysisTemplate cho canary (T12). Rollout tham chiếu theo TÊN nên template phải
  # tồn tại trong cùng namespace trước khi canary chạy, nếu không Rollout degraded.
  - analysistemplate-housing-api.yaml

helmGlobals:
  chartHome: ../../../

helmCharts:
  - name: helm-charts
    releaseName: housing-api
    valuesFile: ../../base/api/values.yaml
    additionalValuesFiles:
      - api/values-prod.yaml

  - name: helm-charts
    releaseName: housing-web
    valuesFile: ../../base/web/values.yaml
    additionalValuesFiles:
      - web/values-prod.yaml

patches:
  - path: rollout-api-patch.yaml
    target:
      group: argoproj.io     
      kind: Rollout          
      name: housing-api
      
  - path: rollout-web-patch.yaml
    target:
      group: argoproj.io
      kind: Rollout
      name: housing-web