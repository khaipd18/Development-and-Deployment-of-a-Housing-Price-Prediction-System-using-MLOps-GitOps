# ArgoCD Application: Apache Airflow (orchestrator Continuous Training) trên EKS.
#   - Helm chart chính thức apache-airflow, executor = KubernetesExecutor
#     (mỗi task = 1 pod ephemeral -> scale-to-zero, rẻ)
#   - Ảnh tùy biến housing-airflow (ECR): kèm code dự án + DAG + deps ML
#   - Metadata -> RDS Postgres qua secret airflow-metadata (key: connection)
#   - IRSA gắn vào SA airflow (quyền S3 read data + rw artifacts)
#   - MLFLOW_TRACKING_URI trỏ MLflow in-cluster
#
# ⚠ Version chart + value keys nên đối chiếu lại lúc apply (Airflow chart hay đổi).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://airflow.apache.org'
    chart: airflow
    targetRevision: 1.15.0
    helm:
      values: |
        executor: "KubernetesExecutor"

        # Ảnh tùy biến (build từ docker/Dockerfile.airflow, push ECR)
        images:
          airflow:
            repository: 090885120487.dkr.ecr.ap-southeast-1.amazonaws.com/housing-airflow
            tag: latest
            pullPolicy: Always

        # DAG bake sẵn trong ảnh -> tắt gitSync & persistence
        dags:
          gitSync:
            enabled: false
          persistence:
            enabled: false

        # Không dùng Postgres/Redis kèm chart -> trỏ RDS ngoài qua secret
        postgresql:
          enabled: false
        pgbouncer:
          enabled: false
        redis:
          enabled: false
        data:
          # secret 'airflow-metadata' tạo lúc bootstrap, key 'connection' =
          # postgresql+psycopg2://platform_admin:...@<rds>:5432/airflow
          metadataSecretName: airflow-metadata

        # ServiceAccount + IRSA. PHẢI khai báo THEO TỪNG COMPONENT.
        #
        # Bản trước đặt khối này ở CẤP CAO NHẤT (`serviceAccount:` ngoài cùng). Chart
        # airflow 1.15.0 KHÔNG có khoá đó — nó chỉ có `serviceAccount` bên trong từng
        # component (`scheduler`, `workers`, `webserver`, `triggerer`, `statsd`,
        # `createUserJob`, `migrateDatabaseJob`, ...). Helm bỏ qua khoá lạ mà KHÔNG
        # cảnh báo, nên annotation IRSA chưa bao giờ được gắn, và không SA nào tên
        # `airflow` được tạo — chỉ có `airflow-scheduler`, `airflow-triggerer`, ...
        #
        # Hậu quả đo được trên cụm 24/10/2026: pod rơi về NODE ROLE
        # (housing-mlops-eks-cluster-node-role) nên mọi lần ghi S3 trả AccessDenied, và
        # CT không đẩy được model nào lên bucket ARTIFACTS. Kiểm bằng
        # `helm show values apache-airflow/airflow --version 1.15.0`: `serviceAccount`
        # chỉ xuất hiện ở cấp component.
        #
        # TẤT CẢ component dùng CHUNG một SA tên `airflow`, không phải mỗi component
        # một SA riêng. Lý do là trust policy của role IRSA do Terraform tạo khoá cứng
        #   sub = system:serviceaccount:airflow:airflow
        # nên nếu để chart tự đặt tên theo component (`airflow-scheduler`, ...) thì STS
        # TỪ CHỐI AssumeRoleWithWebIdentity dù annotation có đúng ARN. Kiểm bằng
        # `aws iam get-role --role-name housing-mlops-airflow-irsa`.
        #
        # Chọn cách này thay vì nới điều kiện IAM thành `airflow-*`: giữ được tính chất
        # "role chỉ assume được bởi ĐÚNG MỘT service account", vốn là thứ làm IAM ở đây
        # còn đáng gọi là least-privilege.
        #
        # scheduler tạo SA; các component khác chỉ THAM CHIẾU (create: false) để Helm
        # không render trùng tài nguyên. Annotation chỉ cần ở chỗ tạo.
        scheduler:
          serviceAccount:
            create: true
            name: airflow
            annotations:
              eks.amazonaws.com/role-arn: "arn:aws:iam::090885120487:role/housing-mlops-airflow-irsa"
        workers:
          serviceAccount:
            create: false
            name: airflow
        triggerer:
          serviceAccount:
            create: false
            name: airflow
          # TẮT persistence. Cụm này KHÔNG cài EBS CSI driver nên PVC của triggerer
          # không bao giờ bind được: pod đứng Pending với
          #   "0/3 nodes are available: pod has unbound immediate PersistentVolumeClaims"
          # và — chỗ này mới là vấn đề — Argo CD coi app là chưa healthy nên MỌI lần
          # sync sau đó treo ở "waiting for healthy state of
          # apps/StatefulSet/airflow-triggerer". Đo được ngày 24/10/2026: chính nó chặn
          # bản sửa IRSA không vào được cụm.
          #
          # Triggerer chỉ cần cho deferrable operator; DAG hcm_ct dùng PythonOperator
          # nên không cần. Giữ component cho đúng kiến trúc chart, bỏ đĩa bền.
          # Muốn có đĩa bền thì phải cài addon aws-ebs-csi-driver kèm IRSA — chưa làm.
          persistence:
            enabled: false

        # Biến môi trường chung cho scheduler/worker/webserver
        env:
          - name: MLFLOW_TRACKING_URI
            value: "http://mlflow.mlflow.svc.cluster.local"
          - name: AWS_DEFAULT_REGION
            value: "ap-southeast-1"
          - name: PYTHONPATH
            value: "/opt/airflow/project"
          # Bật S3 cho Continuous Training: DAG kéo dataset sạch từ bucket DATA
          # (keo_du_lieu_sach) + đẩy model lên ARTIFACTS. Creds qua IRSA (SA airflow).
          - name: HCM_S3_PUSH
            value: "1"
          - name: S3_BUCKET_DATA
            value: "kltn-hcm-mlops-data"
          - name: S3_BUCKET_ARTIFACTS
            value: "kltn-hcm-mlops-artifacts"

        # Tài khoản đăng nhập UI (demo)
        webserver:
          serviceAccount:
            create: false
            name: airflow
          defaultUser:
            enabled: true
            username: admin
            password: admin
            role: Admin
            email: admin@example.com
          service:
            type: ClusterIP

        # Ingress qua ALB (TLS self-signed; bootstrap patch certificate-arn)
        ingress:
          web:
            enabled: true
            ingressClassName: alb
            annotations:
              alb.ingress.kubernetes.io/scheme: internet-facing
              alb.ingress.kubernetes.io/target-type: ip
              alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
              alb.ingress.kubernetes.io/ssl-redirect: '443'
              alb.ingress.kubernetes.io/certificate-arn: "REPLACE_WITH_ACM_ARN"
              alb.ingress.kubernetes.io/healthcheck-path: /health
            path: /
            pathType: Prefix

        # Jobs khởi tạo (migrate schema + tạo user) — bật mặc định
        migrateDatabaseJob:
          enabled: true
          # BẮT BUỘC với ArgoCD: chart khai job migration dưới dạng Helm hook, mà
          # ArgoCD render chart qua `kustomize --enable-helm` nên hook bị LOẠI BỎ —
          # job không bao giờ được tạo, DB không bao giờ migrate, và scheduler kẹt ở
          #   TimeoutError: There are still unapplied migrations after 60 seconds.
          #   MigrationHead(s) in DB: set()
          # Triệu chứng là Init:Error ở scheduler/webserver, nhìn như lỗi pod chứ
          # không ai nghĩ tới hook. Đã gặp thật trên cụm 18/10/2026.
          useHelmHooks: false
          applyCustomEnv: false
        # Triggerer mặc định xin một PVC cho log và PVC đó KHÔNG BAO GIỜ bind được:
        # cụm chỉ cài add-on coredns/kube-proxy/vpc-cni, không có aws-ebs-csi-driver,
        # mà StorageClass `gp2` mặc định lại trỏ vào provisioner in-tree
        # kubernetes.io/aws-ebs. Kết quả: pod Pending vĩnh viễn với
        #   "pod has unbound immediate PersistentVolumeClaims"
        # (đã treo 8 giờ trên cụm thật 18/10/2026).
        #
        # Chọn TẮT persistence thay vì cài thêm EBS CSI driver, cho nhất quán với Loki:
        # cụm là bật-demo-rồi-destroy, emptyDir không tạo EBS nên không có volume nào
        # sống sót sau destroy để rò rỉ chi phí. Log vẫn về Loki qua Alloy.
        # Nếu sau này cần PVC thật thì phải thêm add-on aws-ebs-csi-driver kèm IAM
        # riêng: https://docs.aws.amazon.com/eks/latest/userguide/ebs-csi.html
        logs:
          persistence:
            enabled: false
        # KHÔNG đặt `createUserJob.enabled`: chart 1.15.0 không có khoá đó và
        # ArgoCD từ chối toàn bộ Application với
        #   values don't meet the specifications of the schema(s) ...
        #   at '/createUserJob' additional properties 'enabled' not allowed
        # nên app đứng ở trạng thái Unknown chứ không phải lỗi runtime.
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: airflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
