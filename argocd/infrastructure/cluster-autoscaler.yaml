# Cluster Autoscaler (T12) — auto-scaling ở MỨC NODE.
#
# Phân vai với HPA: HPA thêm POD khi CPU cao; Cluster Autoscaler thêm NODE khi pod
# không xếp được lên node nào. Hai thứ nối tiếp nhau — HPA scale pod tới lúc hết chỗ,
# lúc đó pod sang trạng thái Pending và Cluster Autoscaler mới vào cuộc, điều khiển
# .DesiredCapacity của EC2 Auto Scaling group đứng sau managed node group.
#
# PHIÊN BẢN PHẢI KHỚP PHIÊN BẢN CỤM — tài liệu AWS nói rõ cross-version không được
# kiểm thử và không được hỗ trợ (https://docs.aws.amazon.com/eks/latest/best-practices/cas.html).
# Cụm là EKS 1.35 nên ảnh ghim v1.35.0; đã kiểm tag tồn tại bằng `docker manifest inspect`.
#
# Hai lựa chọn thay thế của AWS, ghi lại theo yêu cầu của kế hoạch:
#   • EKS Auto Mode — AWS tự quản lý việc scale, DỰNG TRÊN Karpenter.
#   • Karpenter — cấp node just-in-time theo đúng yêu cầu workload, nhanh hơn vì
#     không đi qua Auto Scaling group. NHƯNG tài liệu AWS nói rõ đây là phần mềm
#     nguồn mở mà KHÁCH HÀNG tự cài, cấu hình và vận hành, và **không có SLA của
#     AWS**; AWS chỉ hỗ trợ kỹ thuật khi chạy bản tương thích, không sửa đổi.
#     (https://docs.aws.amazon.com/eks/latest/userguide/autoscaling.html)
# Chọn Cluster Autoscaler cho đồ án vì nó bám sát managed node group đã có và là thứ
# trình bày được rõ ràng mối quan hệ pod Pending -> ASG DesiredCapacity.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-autoscaler
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/autoscaler
    chart: cluster-autoscaler
    targetRevision: 9.46.6
    helm:
      releaseName: cluster-autoscaler
      values: |
        cloudProvider: aws
        awsRegion: ap-southeast-1
        autoDiscovery:
          # Autoscaler tự tìm ASG qua tag k8s.io/cluster-autoscaler/<tên cụm>.
          # Managed node group của EKS tự gắn tag này, không phải thêm tay.
          clusterName: housing-mlops-eks-cluster
        image:
          tag: v1.35.0
        rbac:
          serviceAccount:
            name: cluster-autoscaler
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::090885120487:role/housing-mlops-cluster-autoscaler-irsa
        extraArgs:
          # Mặc định là 10 phút. Rút xuống 5 để quan sát được cả chiều co lại trong
          # khung thời gian một buổi đo, thay vì chỉ thấy chiều giãn ra.
          scale-down-unneeded-time: 5m
          scale-down-delay-after-add: 5m
          # Ghi rõ lý do từng quyết định vào log — cần cho phần báo cáo.
          v: 4
        resources:
          requests: {cpu: 100m, memory: 300Mi}
          limits:   {cpu: 200m, memory: 500Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
