{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
  {{- with .Values.service.annotations }}
  # Annotation trên Service được AWS Load Balancer Controller đọc riêng cho từng
  # backend của Ingress — dùng để mỗi target group có health check của chính nó.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # Cổng phải có TÊN thì ServiceMonitor của Prometheus Operator mới tham chiếu
    # được (endpoints[].port nhận tên cổng, không nhận số).
    - name: {{ .Values.service.portName | default "http" }}
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  selector:
    app: {{ .Values.service.selectorOverride | default .Release.Name }}
{{- end }}