{{- if .Values.deployment.enabled }}
apiVersion: {{ .Values.deployment.apiVersion | default "apps/v1" }}
kind: {{ .Values.deployment.kind | default "Deployment" }}
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  {{- /*
  Có HPA thì KHÔNG render replicas. Để cả hai thì HPA giãn Rollout lên 6–8, Argo CD
  thấy lệch với Git và selfHeal ép về replicaCount — đo ngày 25/11/2026 dưới k6:
  HPA scale lên 6 bảy lần, lên 8 ba lần, pod mới bị giết ngay lúc đang khởi động.
  Số replica chỉ được có MỘT chủ: có HPA thì là HPA (minReplicas lo phần tối thiểu).
  */}}
  {{- $hpa := .Values.autoscaling | default dict }}
  {{- if not $hpa.enabled }}
  replicas: {{ .Values.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default .Release.Name }}
      {{- end }}

      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ .Release.Name }}
          {{- if .Values.securityContext }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: main-port
              containerPort: {{ .Values.service.targetPort }}
              
          {{- if .Values.env }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}

          {{- if .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}
          {{- end }}

          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}

          {{- if .Values.probes.startup }}
          startupProbe:
            {{- toYaml .Values.probes.startup | nindent 12 }}
          {{- end }}

          {{- if .Values.probes.readiness }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          {{- end }}
          
          {{- if .Values.probes.liveness }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          {{- end }}
          {{- if .Values.volumeMounts }}
          {{- end }}
      {{- if .Values.volumes }}
      volumes:
        {{- toYaml .Values.volumes | nindent 8 }}
      {{- end }}
{{- end }}